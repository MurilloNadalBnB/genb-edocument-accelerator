<!DOCTYPE html>
<html lang="en" class="sapUShellFullHeight">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GENB Accelerator</title>
	<link rel="icon" type="image/svg+xml" href="webapp/img/favicon-ai.svg">
	<!--
		SAP Fiori launchpad in sandbox mode (spaces and pages, CDM 3.1 site, the same model as SAP Build Work Zone).
		It is the real launchpad from the SAPUI5 CDN, with no backend: the site (spaces, pages, tiles) is in
		launchpad/site.json and the shell settings (user, header) in launchpad/config.json.
		The Mapping Workbench (webapp/) opens inside it as a normal Fiori app. standalone.html has the app on its own (OpenUI5).
	-->
	<script>
		// Links from before the launchpad (#/country/FR/...) are app routes: open them in the standalone app
		if (location.hash.startsWith("#/")) {
			location.replace("standalone.html" + location.search + location.hash);
		}
	</script>
	<script>
		// Language: ?sap-language=xx wins; otherwise the last choice (Settings > Language and Region), otherwise English
		let sLanguage = null;
		try {
			sLanguage = localStorage.getItem("genb-language");
		} catch (e) {
			// storage blocked: English
		}
		// Same steps as sap/ushell/bootstrap/sandbox2.js, but with our own site instead of the SAP sample apps
		window["sap-ui-config"] = {
			"language": sLanguage || "en",
			"xx-bootTask": function (fnDone) {
				sap.ui.require(["sap/ushell/bootstrap/sandbox2/sandbox", "sap/ushell/utils", "sap/base/i18n/Localization"], function (Sandbox, ushellUtils, Localization) {
					(async function () {
						const oConfig = window["sap-ushell-config"] = {};
						const sLang = Localization.getLanguage().split("-")[0].toLowerCase();
						const [oDefaults, oOwn, oSite, oTexts] = await Promise.all([
							Sandbox._loadJSON(sap.ui.require.toUrl("sap/ushell/bootstrap/sandbox2/sandboxConfig.json")),
							Sandbox._loadJSON("launchpad/config.json"),
							Sandbox._loadJSON("launchpad/site.json"),
							// tile texts use the same dictionary as the app content (English text = key)
							sLang === "en" ? {} : fetch(`webapp/i18n/content_${sLang}.json`).then(r => r.ok ? r.json() : {}, () => ({}))
						]);
						(function translate(o) {
							Object.keys(o).forEach(k => {
								if (typeof o[k] === "string" && ["title", "subTitle", "info", "description"].includes(k)) {
									o[k] = oTexts[o[k]] || o[k];
								} else if (o[k] && typeof o[k] === "object") {
									translate(o[k]);
								}
							});
						})(oSite);
						Sandbox._applyDefaultUshellConfig(oDefaults, oConfig);
						Sandbox._applyDefaultUshellConfig(oOwn, oConfig); // ours wins over the SAP defaults
						Object.assign(oConfig.services.Container.adapter.config.userProfile.defaults, {language: sLang, languageBcp47: sLang});
						Sandbox._applyDefaultSiteData(oSite, oConfig);
						const [Container] = await ushellUtils.requireAsync(["sap/ushell/Container"]);
						await Container.init("cdm");
					})().then(fnDone, function (oError) {
						console.error("Launchpad sandbox failed to start", oError);
						fnDone();
					});
				});
			}
		};
	</script>
	<!-- SAPUI5 (not OpenUI5): the launchpad (sap.ushell) is only in SAPUI5. Same LTS patch as standalone.html. -->
	<script
		id="sap-ui-bootstrap"
		src="https://ui5.sap.com/1.148.9/resources/sap-ui-core.js"
		data-sap-ui-libs="sap.m, sap.ushell"
		data-sap-ui-resource-roots='{"launchpad": "./launchpad/"}'
		data-sap-ui-theme="sap_horizon"
		data-sap-ui-compat-version="edge"
		data-sap-ui-async="true"
		data-sap-ui-xx-component-preload="off"></script>
	<script>
		sap.ui.require(["sap/ui/core/Core"], function (Core) {
			Core.ready().then(function () {
				sap.ui.require(["sap/ushell/Container"], function (Container) {
					Container.createRendererInternal("fiori2").then(function (oRenderer) {
						oRenderer.placeAt("content");
						sap.ui.require(["launchpad/shell"], function (shell) {
							shell.init(Container);
						});
					});
				});
			});
		});
	</script>
</head>
<body class="sapUiBody sapUShellFullHeight" id="content"></body>
</html>
