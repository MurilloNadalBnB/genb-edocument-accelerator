home.atAGlance=Auf einen Blick
home.checkMasterData=Meine Stammdaten pr\u00fcfen
home.headline=eDocument-XML-Felder ohne Programmierung SAP zuordnen
home.how=So funktioniert es
home.intro=W\u00e4hlen Sie ein Land und ein Szenario und klicken Sie sich durch ein echtes XML. F\u00fcr jedes Feld legen Sie fest, woher der Wert in SAP kommt, wie er gepr\u00fcft und wie er ge\u00e4ndert werden muss. Der Accelerator macht daraus ABAP f\u00fcr das eDocument-Framework, oder B&B implementiert es f\u00fcr Sie.
home.step1=1. Land ausw\u00e4hlen
home.step1Text=Jedes Land bringt seine gesetzlichen XML-Formate, eDocument-Typen und Schnittstellen bereits konfiguriert mit.
home.step2=2. Szenario w\u00e4hlen
home.step2Text=Verkauf, Einkauf, Gutschriftverfahren, Zahlungen oder Reporting. Die SAP-Tabellen h\u00e4ngen von der Quelle ab (SD, MM oder FI).
home.step3=3. Regeln je XML-Feld definieren
home.step3Text=Klicken Sie auf ein Feld, w\u00e4hlen Sie das SAP-Feld und legen Sie fest, was damit geschieht. Der KI-Assistent erkl\u00e4rt jedes Feld.
home.step4=4. Generieren oder von B&B implementieren lassen
home.step4Text=Erhalten Sie Adapter, E-Mail, kundeneigene Felder und UI-Funktionen in ABAP oder senden Sie das Paket mit einem Klick an B&B.
