# --- home ---
home.aiSubtitle=Arbeiten Sie mit Joule, dem SAP Generative AI Hub, GENB AI oder einer beliebigen Kombination. Nutzen Sie, was Sie bei SAP bereits haben, und erg\u00e4nzen Sie das DRC-Wissen, das B&B in Live-Projekten gesammelt hat.
