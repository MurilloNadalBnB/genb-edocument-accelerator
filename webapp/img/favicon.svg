<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Favicon B|B">
  <!-- Fundo preto com cantos levemente arredondados -->
  <rect x="0" y="0" width="100" height="100" rx="12" ry="12" fill="#000000"/>

  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="square">
    <!-- B esquerdo (espelhado) — deslocado para cima -->
    <g transform="translate(0, -5)">
      <line x1="22" y1="25" x2="22" y2="75"/>
      <line x1="22" y1="25" x2="34" y2="25"/>
      <line x1="22" y1="50" x2="34" y2="50"/>
      <line x1="22" y1="75" x2="34" y2="75"/>
      <path d="M 34 25 C 46 25, 46 50, 34 50"/>
      <path d="M 34 50 C 46 50, 46 75, 34 75"/>
    </g>

    <!-- Divisor central -->
    <line x1="50" y1="20" x2="50" y2="80" stroke-width="2"/>

    <!-- B direito (na posição original) -->
    <line x1="78" y1="25" x2="78" y2="75"/>
    <line x1="66" y1="25" x2="78" y2="25"/>
    <line x1="66" y1="50" x2="78" y2="50"/>
    <line x1="66" y1="75" x2="78" y2="75"/>
    <path d="M 66 25 C 54 25, 54 50, 66 50"/>
    <path d="M 66 50 C 54 50, 54 75, 66 75"/>
  </g>
</svg>
